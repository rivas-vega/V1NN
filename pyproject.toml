[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "v1nn"
version = "0.1.0"
description = "Controlled tests of visual connectome topology without pretrained encoders"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
data = ["pandas>=2.0", "pyarrow>=14"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
